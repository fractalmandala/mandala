[project]
name = "skaa-harness"
version = "0.1.0"
description = "Portable, installable smrti (memory) MCP server — SKAA framework"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skaa"]
