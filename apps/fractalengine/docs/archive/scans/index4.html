<script>
"use strict";
window.onerror = (m, s, l) => { document.getElementById("err").textContent = m + " @" + (s||"").split("/").pop() + ":" + l; };

const DATA = JSON.parse(document.getElementById("atlas-data").textContent);
const nodes = DATA.nodes.map(n => ({ ...n }));
const links = DATA.links.map(l => ({ source: l.s, target: l.t, w: l.w }));
const byId = new Map(nodes.map(n => [n.id, n]));

/* ---------------- layout ---------------- */
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(34).strength(0.22))
  .force("charge", d3.forceManyBody().strength(d => -14 - Math.sqrt(d.size) * 1.1))
  .force("collide", d3.forceCollide(d => radius(d) + 3).strength(0.9))
  .force("x", d3.forceX(0).strength(0.045))
  .force("y", d3.forceY(0).strength(0.06))
  .stop();
for (let i = 0; i < 320; i++) sim.tick();
/* scrub any non-finite positions */
for (const n of nodes) {
  if (!isFinite(n.x) || !isFinite(n.y)) { n.x = Math.random() * 600 - 300; n.y = Math.random() * 600 - 300; }
}

/* bounds + fit */
let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
for (const n of nodes) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); }

/* ---------------- style ---------------- */
function radius(n) { return 3 + Math.sqrt(n.size) * 1.35; }
const degMax = Math.max(...nodes.map(n => n.deg), 1);
const RAMP = [[22,78,99],[34,211,238],[167,139,250],[251,191,36]];
function color(t, a = 1) {
  const x = Math.min(Math.max(t, 0), 1) * (RAMP.length - 1);
  const i = Math.min(Math.floor(x), RAMP.length - 2), u = x - i;
  const c = RAMP[i].map((v, k) => Math.round(v + (RAMP[i+1][k] - v) * u));
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
const heat = n => Math.pow(Math.log1p(n.deg) / Math.log1p(degMax), 0.75);

/* adjacency */
const adj = new Map();
links.forEach((l, i) => {
  const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
  l.source = s; l.target = t;
  (adj.get(s) ?? adj.set(s, []).get(s)).push({ o: t, w: l.w, i });
  (adj.get(t) ?? adj.set(t, []).get(t)).push({ o: s, w: l.w, i });
});

/* always-labelled hubs */
const TOP = new Set([...nodes].sort((a, b) => b.deg - a.deg).slice(0, 26).map(n => n.id));

/* ---------------- canvas ---------------- */
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  draw();
}
addEventListener("resize", resize);

const view = { x: 0, y: 0, k: 1 };
function fit() {
  const bw = maxX - minX, bh = maxY - minY, pad = 90;
  view.k = Math.min((W - pad) / bw, (H - pad) / bh);
  view.x = W / 2 - ((minX + maxX) / 2) * view.k;
  view.y = H / 2 - ((minY + maxY) / 2) * view.k;
}
const toScreen = (x, y) => [x * view.k + view.x, y * view.k + view.y];

let hover = null, selected = null, query = "";
function matches(n) { return !query || n.name.toLowerCase().includes(query); }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* starfield (deterministic) */
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 220; i++) {
    const x = (i * 137.51) % W, y = (i * 89.37) % H;
    ctx.globalAlpha = 0.05 + (i % 5) * 0.02;
    ctx.fillRect(x, y, i % 7 === 0 ? 1.6 : 1, i % 7 === 0 ? 1.6 : 1);
  }
  ctx.globalAlpha = 1;

  const focus = hover ?? selected;
  const focusAdj = focus ? new Set([focus, ...(adj.get(focus) || []).map(e => e.o)]) : null;
  const hasQuery = !!query;

  /* edges */
  ctx.lineCap = "round";
  for (const l of links) {
    const s = byId.get(l.source), t = byId.get(l.target);
    if (!s || !t) continue;
    let a = 0.05 + Math.min(l.w, 20) / 20 * 0.10;
    let col = `rgba(150,170,255,${a})`;
    if (focusAdj) {
      const hot = focusAdj.has(s.id) && focusAdj.has(t.id) && (s.id === focus || t.id === focus);
      if (!hot) continue;
      col = `rgba(103,232,249,${0.35 + Math.min(l.w,20)/20*0.4})`;
    } else if (hasQuery && !matches(s) && !matches(t)) {
      col = "rgba(150,170,255,0.015)";
    }
    const [x1, y1] = toScreen(s.x, s.y), [x2, y2] = toScreen(t.x, t.y);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.4, Math.min(Math.sqrt(l.w) * 0.8, 4) * view.k * 0.5);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  /* nodes */
  for (const n of nodes) {
    if (!isFinite(n.x) || !isFinite(n.y)) continue;
    const [x, y] = toScreen(n.x, n.y);
    if (!isFinite(x) || !isFinite(y)) continue;
    if (x < -60 || y < -60 || x > W + 60 || y > H + 60) continue;
    const r = Math.max(radius(n) * Math.sqrt(view.k), 0.5);
    if (!isFinite(r)) continue;
    const t = heat(n);
    let alpha = 0.92, glow = 0;
    if (focusAdj) { alpha = focusAdj.has(n.id) ? 1 : 0.08; glow = n.id === focus ? 1 : 0; }
    else if (hasQuery) { const m = matches(n); alpha = m ? 1 : 0.06; glow = m ? 0.55 : 0; }

    if (t > 0.55 || glow) {
      const rOuter = Math.max(r * 4, r * 0.4 + 0.01);
      const g = ctx.createRadialGradient(x, y, r * 0.4, x, y, rOuter);
      g.addColorStop(0, color(t, 0.20 + glow * 0.3)); g.addColorStop(1, color(t, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rOuter, 0, 7); ctx.fill();
    }
    ctx.fillStyle = color(t, alpha);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.5 * alpha})`;
    ctx.beginPath(); ctx.arc(x - r * 0.28, y - r * 0.3, Math.max(r * 0.22, 0.5), 0, 7); ctx.fill();

    /* labels for big, famous, or focused */
    if ((view.k * r > 9 || TOP.has(n.id) || (focusAdj && focusAdj.has(n.id) && n.id !== focus)) && alpha > 0.3) {
      const big = TOP.has(n.id);
      ctx.font = `${big ? 600 : 500} ${big ? Math.max(9.5, Math.min(12, 7 * view.k)) : Math.max(9.5, Math.min(12, 6 * view.k))}px Inter`;
      ctx.fillStyle = `rgba(231,233,255,${Math.min(alpha, big ? 0.62 : 0.85)})`;
      ctx.fillText(n.name, x + r + 4, y + 3.5);
    }
  }
  if (focus) {
    const n = byId.get(focus); const [x, y] = toScreen(n.x, n.y);
    const r = radius(n) * Math.sqrt(view.k) + 5;
    ctx.strokeStyle = "rgba(251,191,36,0.85)"; ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = "600 12px Inter"; ctx.fillStyle = "#fde68a";
    ctx.fillText(n.name, x + r + 6, y + 4);
  }
}

/* ---------------- interaction ---------------- */
const qt = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes);
function pick(mx, my) {
  const gx = (mx - view.x) / view.k, gy = (my - view.y) / view.k;
  const n = qt.find(gx, gy, 30 / view.k + 8);
  if (n && Math.hypot(n.x - gx, n.y - gy) <= radius(n) + 6 / view.k) return n.id;
  return null;
}
let drag = null, moved = false;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; canvas.classList.add("dragging"); });
addEventListener("pointermove", e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy; draw(); return;
  }
  const id = pick(e.clientX, e.clientY);
  if (id !== hover) { hover = id; canvas.style.cursor = id ? "pointer" : "grab"; draw(); }
});
addEventListener("pointerup", e => {
  canvas.classList.remove("dragging");
  if (drag && !moved) { const id = pick(e.clientX, e.clientY); if (id) openPanel(id); else closePanel(); }
  drag = null;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.13 : 1 / 1.13;
  const k2 = Math.min(Math.max(view.k * f, 0.15), 14);
  view.x = e.clientX - ((e.clientX - view.x) / view.k) * k2;
  view.y = e.clientY - ((e.clientY - view.y) / view.k) * k2;
  view.k = k2; draw();
}, { passive: false });
canvas.addEventListener("dblclick", e => {
  const id = pick(e.clientX, e.clientY);
  if (id) flyTo(id);
});

/* smooth fly-to */
let flyAnim = null;
function flyTo(id, openAfter = true) {
  const n = byId.get(id); if (!n) return;
  const k2 = Math.max(view.k, 1.7);
  const x2 = W / 2 - n.x * k2, y2 = H / 2 - n.y * k2;
  const s = { x: view.x, y: view.y, k: view.k }, t0 = performance.now();
  if (flyAnim) cancelAnimationFrame(flyAnim);
  const step = (t) => {
    const u = Math.min((t - t0) / 650, 1), e = 1 - Math.pow(1 - u, 3);
    view.x = s.x + (x2 - s.x) * e; view.y = s.y + (y2 - s.y) * e; view.k = s.k + (k2 - s.k) * e;
    draw();
    if (u < 1) flyAnim = requestAnimationFrame(step);
    else { flyAnim = null; if (openAfter) openPanel(id); }
  };
  flyAnim = requestAnimationFrame(step);
}

/* ---------------- panel ---------------- */
const panel = document.getElementById("panel");
function openPanel(id) {
  selected = id; hover = null;
  const n = byId.get(id);
  document.getElementById("p-kicker").textContent = `cluster #${id}`;
  document.getElementById("p-name").textContent = n.name;
  const nbrs = (adj.get(id) || []).slice().sort((a, b) => b.w - a.w);
  document.getElementById("p-meta").innerHTML =
    `<b>${n.size}</b> documents · <b>${n.deg}</b> links · <b>${nbrs.length}</b> neighbours`;
  document.getElementById("p-docs").innerHTML = n.top.map(d => `
    <div class="doc"><div class="d-name">${esc(d.label)}</div>
    <div class="d-deg">${d.deg} link${d.deg === 1 ? "" : "s"}</div></div>`).join("");
  const ne = document.getElementById("p-nbrs");
  ne.innerHTML = "";
  nbrs.slice(0, 14).forEach(nb => {
    const b = document.createElement("span");
    b.className = "nbr"; b.textContent = `${byId.get(nb.o).name} (${nb.w})`;
    b.onclick = () => openPanel(nb.o);
    ne.appendChild(b);
  });
  panel.classList.add("open"); draw();
}
function closePanel() { selected = null; panel.classList.remove("open"); draw(); }
document.getElementById("p-close").onclick = closePanel;
addEventListener("keydown", e => {
  if (e.key === "Escape") closePanel();
  if (e.key === "/" && document.activeElement !== document.getElementById("search")) { e.preventDefault(); document.getElementById("search").focus(); }
});

/* ---------------- search ---------------- */
let searchT = null;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { query = e.target.value.trim().toLowerCase(); draw(); }, 120);
});
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const best = nodes.filter(n => n.name.toLowerCase().includes(q)).sort((a, b) => b.deg - a.deg)[0];
  if (best) { e.target.blur(); flyTo(best.id); }
});

/* ---------------- top clusters list ---------------- */
(function buildTop() {
  const el = document.getElementById("top");
  const maxSize = Math.max(...nodes.map(n => n.size), 1);
  el.innerHTML = "<h4>Largest clusters</h4>";
  [...nodes].sort((a, b) => b.size - a.size).slice(0, 9).forEach((n, i) => {
    const row = document.createElement("div");
    row.className = "top-row";
    row.innerHTML = `<span class="top-rank">${i + 1}</span>
      <span class="top-body"><span class="top-name">${esc(n.name)}</span>
      <span class="top-bar"><i style="width:${Math.round(n.size / maxSize * 100)}%;background:${color(heat(n))}"></i></span></span>
      <span class="top-n">${fmt(n.size)}</span>`;
    row.onclick = () => flyTo(n.id);
    el.appendChild(row);
  });
})();

/* ---------------- chrome ---------------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n); }
[["documents", DATA.stats.documents, "#67e8f9"], ["links", DATA.stats.links, "#a78bfa"], ["clusters", DATA.stats.communities, "#fbbf24"]].forEach(([l, v, c]) => {
  const d = document.createElement("div"); d.className = "stat";
  d.innerHTML = `<b style="color:${c}">${fmt(v)}</b><span>${l}</span>`;
  document.getElementById("stats").appendChild(d);
});

/* ---------------- go ---------------- */
