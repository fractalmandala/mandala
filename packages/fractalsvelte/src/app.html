<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// No-flash: re-apply the last-used palette's CSS variables before first paint. Default
			// palette is covered by theme-base.sass (:root / .dark); this covers non-default palettes
			// on return visits. mode-watcher handles the light/dark class itself.
			(function () {
				try {
					var v = JSON.parse(localStorage.getItem("fs-theme-vars") || "null");
					if (v) {
						var s = document.documentElement.style;
						for (var k in v) s.setProperty(k, v[k]);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
