<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mandala documentation templates — prototype review</title>
	<style>
		:root {
			--font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			font-family: var(--font-sans);
			color: #1c1d1a;
			background: #f7f7f7;
			font-synthesis: none;
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; }
		button, input { font: inherit; }
		button { cursor: pointer; }
		.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
		.rail { padding: 28px 20px; background: #fff; border-right: 1px solid #e4e4e4; }
		.eyebrow { margin: 0 0 8px; color: #77736b; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
		.rail h1 { margin: 0 0 34px; font-family: var(--font-sans); font-size: 25px; font-weight: 700; letter-spacing: -.05em; }
		.site-list, .view-list { display: grid; gap: 7px; }
		.site-button, .view-button { width: 100%; padding: 12px 13px; border: 1px solid transparent; border-radius: 7px; color: #66635c; background: transparent; text-align: left; }
		.site-button { display: flex; align-items: center; gap: 10px; font-weight: 700; }
		.site-button:hover, .view-button:hover { background: #ebe8e1; }
		.site-button.active, .view-button.active { color: #191a17; border-color: #d8d8d8; background: #fff; box-shadow: 0 4px 14px #aaa8a425; }
		.site-dot { width: 9px; height: 9px; border-radius: 50%; background: #a6a49b; }
		.site-button[data-site="mandala"] .site-dot { background: #6f8a64; }
		.site-button[data-site="agentic"] .site-dot { background: #9de05f; }
		.site-button[data-site="design"] .site-dot { background: #a53869; }
		.rail-rule { height: 1px; margin: 28px 0; background: #d5d1c7; }
		.view-button { font-size: 13px; }
		.note { position: absolute; right: 20px; bottom: 20px; max-width: 210px; color: #77736b; font-size: 11px; line-height: 1.5; }
		.stage { min-width: 0; padding: 28px; }
		.stage-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1440px; margin: 0 auto 22px; }
		.stage-title { color: #6e6b63; font-size: 12px; letter-spacing: .04em; }
		.stage-title strong { color: #242522; }
		.device-controls { display: flex; gap: 6px; padding: 4px; border: 1px solid #dedede; border-radius: 8px; background: #fff; }
		.device-button { padding: 6px 9px; border: 0; border-radius: 5px; color: #77736b; background: transparent; font-size: 11px; }
		.device-button.active { color: #1f211d; background: #fff; box-shadow: 0 2px 8px #aaa8a425; }
		.canvas-wrap { display: flex; justify-content: center; min-height: calc(100vh - 90px); }
		.canvas { width: 100%; max-width: 1320px; min-height: 850px; overflow: hidden; border: 1px solid #cbc5b9; border-radius: 13px; background: var(--paper); box-shadow: 0 24px 70px #77736b2b; transition: max-width .25s ease; }
		.canvas.mobile { max-width: 420px; }
		.preview-nav { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 32px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
		.brand { color: var(--ink); font-family: var(--font-sans); font-size: 19px; font-weight: 700; letter-spacing: -.04em; }
		.nav-links { display: flex; gap: 20px; }
		.nav-links button { padding: 0; border: 0; color: inherit; background: none; font-size: inherit; }
		.nav-links button:hover { color: var(--accent); }
		.nav-utility { display: flex; align-items: center; gap: 8px; }
		.search { width: 150px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--soft); font-size: 11px; outline: none; }
		.search:focus { border-color: var(--accent); }
		.preview { color: var(--ink); background: var(--paper); }
		.preview.mandala { --paper: #fdfdfb; --soft: #f6f7f2; --ink: #283329; --muted: #68766b; --line: #dfe3dc; --accent: #0baf44; --accent-deep: #0f7a2a; --accent-soft: #e8f7ed; --serif: var(--font-sans); }
		.preview.agentic { --paper: #fdfdfd; --soft: #f7f7f5; --ink: #20211f; --muted: #72736f; --line: #e4e4e1; --accent: #e97822; --accent-soft: #fff0e4; --serif: var(--font-sans); }
		.preview.design { --paper: #fdfdfd; --soft: #f7f2f6; --ink: #1b1720; --muted: #746b76; --line: #ddd7df; --accent: #d10a68; --accent-deep: #97104f; --accent-hot: #ff007a; --accent-soft: #fce8f2; --serif: var(--font-sans); }
		.home { padding: 74px 8%; }
		.home-kicker, .doc-kicker { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
		.home h2 { max-width: 760px; margin: 18px 0 18px; font-family: var(--serif); font-size: clamp(44px, 7vw, 94px); font-weight: 400; letter-spacing: -.075em; line-height: .93; }
		.home-lede { max-width: 570px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.65; }
		.home-actions { display: flex; gap: 10px; margin-top: 30px; }
		.primary, .secondary { padding: 11px 15px; border: 1px solid var(--accent); border-radius: 5px; font-size: 12px; font-weight: 700; }
		.primary { color: var(--paper); background: var(--accent); }
		.secondary { color: var(--accent); background: transparent; }
		.primary:hover, .secondary:hover { filter: brightness(.94); }
		.mandala-orbit { position: absolute; right: 10%; top: 154px; width: 230px; height: 230px; border: 1px solid var(--accent); border-radius: 50%; opacity: .55; }
		.mandala-orbit::before, .mandala-orbit::after { position: absolute; content: ""; inset: 28px; border: 1px solid var(--accent); border-radius: 50%; }
		.mandala-orbit::after { inset: 76px; background: var(--accent-soft); }
		.mandala-symbol { position: absolute; inset: 88px; z-index: 1; display: grid; place-items: center; color: var(--accent); font-family: var(--font-sans); font-size: 35px; }
		.section { margin-top: 110px; }
		.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 19px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
		.section-head h3 { margin: 0; font-family: var(--serif); font-size: 27px; font-weight: 400; letter-spacing: -.04em; }
		.section-head span { color: var(--muted); font-size: 11px; }
		.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
		.card { min-height: 170px; padding: 20px; border: 1px solid var(--line); background: color-mix(in srgb, var(--soft) 45%, transparent); }
		.card:nth-child(2) { transform: translateY(20px); }
		.card-index { color: var(--accent); font-size: 10px; font-weight: 800; }
		.card h4 { margin: 30px 0 9px; font-family: var(--serif); font-size: 23px; font-weight: 400; }
		.card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
		.agentic .preview-nav { font-family: var(--font-sans); }
		.agentic .brand { font-family: var(--font-sans); font-size: 14px; letter-spacing: -.03em; }
		.agentic .home { padding-top: 78px; }
		.agentic .home h2 { max-width: 720px; font-family: var(--font-sans); font-size: clamp(37px, 6vw, 78px); font-weight: 700; letter-spacing: -.09em; line-height: .98; }
		.agentic .home-lede { max-width: 620px; font-size: 15px; }
		.agentic .card-grid { grid-template-columns: repeat(2, 1fr); }
		.agentic .card { min-height: 150px; background: var(--soft); }
		.agentic .card:nth-child(2) { transform: none; }
		.agentic .card h4 { margin-top: 22px; font-family: var(--font-sans); font-size: 18px; }
		.agentic .mandala-orbit { right: 12%; border-style: dashed; }
		.design .home h2 { max-width: 650px; font-size: clamp(50px, 7vw, 100px); }
		.design .home-lede { font-family: var(--font-sans); font-size: 18px; }
		.design .card-grid { grid-template-columns: 1.3fr .8fr .8fr; }
		.design .card { border-radius: 18px 3px 18px 3px; }
		.design .card:nth-child(2) { transform: translateY(36px); }
		.design .card:nth-child(3) { transform: translateY(-10px); }
		.document { display: grid; grid-template-columns: 220px minmax(0, 650px) 170px; gap: 46px; padding: 70px 8%; }
		.document-aside { color: var(--muted); font-size: 11px; }
		.document-aside strong { display: block; margin-bottom: 12px; color: var(--ink); font-size: 12px; }
		.document-aside button { display: block; width: 100%; padding: 8px 0; border: 0; color: inherit; background: none; text-align: left; font-size: inherit; }
		.document-aside button.active, .document-aside button:hover { color: var(--accent); }
		.document-main h2 { margin: 13px 0 18px; font-family: var(--serif); font-size: clamp(40px, 5vw, 67px); font-weight: 400; letter-spacing: -.07em; line-height: 1; }
		.document-intro { margin: 0 0 35px; color: var(--muted); font-size: 16px; line-height: 1.65; }
		.meta { display: flex; gap: 15px; margin-bottom: 32px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
		.prose { color: var(--ink); font-family: var(--font-sans); font-size: 17px; line-height: 1.75; }
		.prose h3 { margin-top: 42px; font-size: 29px; font-weight: 400; letter-spacing: -.05em; }
		.prose p { margin: 16px 0; }
		.callout { margin: 28px 0; padding: 17px 20px; border-left: 2px solid var(--accent); color: var(--muted); background: var(--soft); font-family: inherit; font-size: 14px; }
		.document-right { color: var(--muted); font-size: 10px; line-height: 1.6; }
		.document-right strong { display: block; margin-bottom: 13px; color: var(--ink); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
		.document-right a { display: block; margin-bottom: 9px; color: inherit; text-decoration: none; }
		.document-right a:hover { color: var(--accent); }
		.agentic .document { grid-template-columns: 180px minmax(0, 680px) 160px; font-family: var(--font-sans); }
		.agentic .document-main h2 { font-family: var(--font-sans); font-size: clamp(34px, 5vw, 60px); letter-spacing: -.1em; }
		.agentic .prose { font-family: var(--font-sans); font-size: 14px; line-height: 1.8; }
		.agentic .prose h3 { font-family: var(--font-sans); font-size: 22px; }
		.agentic .callout { border: 1px solid var(--line); border-left: 2px solid var(--accent); }
		.design .document { grid-template-columns: 180px minmax(0, 660px) 160px; }
		.design .document-main h2 { font-size: clamp(45px, 5vw, 75px); }
		.design .prose { font-size: 18px; }
		.design .callout { border-radius: 14px 2px 14px 2px; }
		/* Distinct composition pass: each product gets its own information architecture. */
		.agentic-home { padding: 44px 5% 70px; font-family: var(--font-sans); }
		.agentic-hero { padding-bottom: 62px; border-bottom: 1px solid var(--line); }
		.agentic-hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(260px, .65fr); gap: 50px; align-items: end; margin-top: 16px; }
		.agentic-home h2 { max-width: 700px; margin: 0; font-size: clamp(42px, 6vw, 82px); font-weight: 500; letter-spacing: -.1em; line-height: .98; }
		.agentic-home .home-lede { max-width: 560px; margin-top: 25px; font-size: 14px; line-height: 1.8; }
		.agentic-console { padding: 19px; border: 1px solid var(--line); background: var(--soft); }
		.agentic-console-head { display: flex; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; }
		.agentic-console-head strong { color: var(--ink); }
		.agentic-console-row { display: flex; justify-content: space-between; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
		.agentic-console-row:last-child { border-bottom: 0; }
		.agentic-console-row span:last-child { color: var(--accent); }
		.agentic-index { padding-top: 35px; }
		.agentic-index-top { display: flex; align-items: end; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
		.agentic-index-top h3 { margin: 0; font-size: 15px; font-weight: 500; }
		.agentic-index-top span { color: var(--muted); font-size: 10px; }
		.agentic-index-list { display: grid; }
		.agentic-index-row { display: grid; grid-template-columns: 38px 1.2fr 1.6fr 70px; gap: 15px; align-items: center; padding: 19px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
		.agentic-index-row strong { color: var(--ink); font-weight: 500; }
		.agentic-index-row small { color: var(--accent); font-size: 10px; }
		.design-home { padding: 36px 6% 75px; }
		.design-home-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; align-items: end; min-height: 290px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
		.design-home-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
		.design-home h2 { margin: 24px 0 0; font-family: var(--serif); font-size: clamp(50px, 7vw, 102px); font-weight: 400; letter-spacing: -.085em; line-height: .9; }
		.design-home-lede { max-width: 340px; margin: 0 0 6px; font-family: var(--serif); font-size: 19px; line-height: 1.42; }
		.design-board { display: grid; grid-template-columns: 1.35fr .65fr .8fr; gap: 12px; margin-top: 46px; }
		.design-board article { min-height: 198px; padding: 18px; border: 1px solid var(--line); }
		.design-feature { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; min-height: 410px !important; border-radius: 22px 4px 22px 4px; color: #fff; background: var(--accent); }
		.design-feature h3 { max-width: 330px; margin: 35px 0 0; font-family: var(--serif); font-size: 42px; font-weight: 400; letter-spacing: -.07em; line-height: .95; }
		.design-board .board-label { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
		.design-board h4 { margin: 32px 0 9px; font-family: var(--serif); font-size: 23px; font-weight: 400; letter-spacing: -.05em; }
		.design-board p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
		.design-feature .board-label, .design-feature p { color: #f7e9f0; }
		.design-feature h3 { color: #fff; }
		.agentic-doc, .design-doc { padding: 52px 6% 80px; }
		.agentic-doc-head { display: grid; grid-template-columns: 1fr 220px; gap: 35px; padding-bottom: 32px; border-bottom: 1px solid var(--line); font-family: var(--font-sans); }
		.agentic-doc h2 { max-width: 650px; margin: 14px 0 0; font-size: clamp(38px, 5vw, 66px); font-weight: 500; letter-spacing: -.1em; line-height: .98; }
		.agentic-doc-summary { align-self: end; color: var(--muted); font-size: 12px; line-height: 1.7; }
		.agentic-doc-body { display: grid; grid-template-columns: 155px minmax(0, 650px); gap: 52px; padding-top: 34px; font-family: var(--font-sans); }
		.agentic-doc-nav { color: var(--muted); font-size: 10px; }
		.agentic-doc-nav strong { display: block; margin-bottom: 14px; color: var(--ink); }
		.agentic-doc-nav button { display: block; padding: 7px 0; border: 0; color: inherit; background: none; text-align: left; font-size: inherit; }
		.agentic-doc-nav button:hover { color: var(--accent); }
		.design-doc { display: grid; grid-template-columns: 110px minmax(0, 690px) 170px; gap: 45px; }
		.design-doc-number { color: var(--accent); font-family: var(--serif); font-size: 86px; letter-spacing: -.1em; line-height: .8; }
		.design-doc-main .doc-kicker { display: block; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
		.design-doc-main h2 { margin: 26px 0 19px; font-family: var(--serif); font-size: clamp(48px, 6vw, 86px); font-weight: 400; letter-spacing: -.09em; line-height: .9; }
		.design-doc-main .document-intro { max-width: 520px; font-family: var(--serif); font-size: 20px; }
		.design-doc-main .prose { font-family: var(--serif); font-size: 18px; }
		.design-doc-main .callout { border-radius: 22px 4px 22px 4px; }
		.design-doc-related { align-self: end; padding-bottom: 8px; color: var(--muted); font-size: 11px; line-height: 1.6; }
		.design-doc-related strong { display: block; margin-bottom: 12px; color: var(--ink); }
		.mandala .primary { background: #0f7a2a; border-color: #0f7a2a; }
		.mandala .secondary, .mandala .home-kicker, .mandala .card-index { color: #0baf44; }
		.design .preview-nav { border-color: #d8d2da; background: #fff; box-shadow: 0 3px 0 #1b172018; }
		.design .brand { color: var(--ink); font-weight: 700; }
		.design .search { border-color: #d7d0d9; background: #fff; box-shadow: 3px 3px 0 #1b172018; }
		.design .primary { border-color: var(--accent-hot); background: linear-gradient(135deg, var(--accent-deep), var(--accent-hot)); box-shadow: 6px 6px 0 #1b172033; }
		.design .secondary { border-color: var(--ink); color: var(--ink); background: #fff; box-shadow: 5px 5px 0 #1b172026; }
		.design .primary:hover, .design .secondary:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #1b172033; }
		.design-home-intro { border-color: #d8d2da; }
		.design-home-meta span:last-child, .design-home .board-label { color: var(--accent); }
		.design-feature { position: relative; overflow: hidden; border-color: #1b1720 !important; background: linear-gradient(135deg, var(--accent-deep), var(--accent-hot)); box-shadow: 12px 12px 0 #1b1720; }
		.design-feature::after { position: absolute; right: -25px; bottom: -33px; width: 185px; height: 185px; border: 2px solid #ffffff66; border-radius: 50%; box-shadow: 0 0 0 27px #ffffff12, 0 0 0 54px #ffffff0d; content: ""; }
		.design-board { gap: 18px; }
		.design-board article { border-color: #d5ced8; border-radius: 4px; background: #fff; box-shadow: 8px 8px 0 #1b17201c; }
		.design-board article:nth-child(2) { transform: translateY(12px); }
		.design-board article:nth-child(3) { transform: translateY(-6px); }
		.design-board article:nth-child(4) { transform: translateY(18px); }
		.design-board article:not(.design-feature):hover { transform: translate(-2px, -2px); box-shadow: 11px 11px 0 #1b17202a; }
		.design-board h4 { color: var(--ink); }
		.design-doc { align-items: start; }
		.design-doc-main { padding: 32px 0 42px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
		.design-doc-main .doc-kicker { border-color: #d8d2da; color: var(--accent); }
		.design-doc-main h2 { color: var(--ink); }
		.design-doc-number { color: var(--accent-hot); text-shadow: 3px 3px 0 #1b17201c; }
		.design-doc-main .callout { border: 1px solid #d5ced8; border-left: 4px solid var(--accent); background: var(--accent-soft); box-shadow: 6px 6px 0 #1b17201c; }
		.design-doc-related { padding: 18px; border: 1px solid #d5ced8; background: #fff; box-shadow: 7px 7px 0 #1b17201c; }
		.design-doc-related strong { color: var(--accent); }
		.agentic .preview-nav { background: #fff; box-shadow: 0 1px 4px #1b1c1a0b; }
		.agentic .search { border-color: #dededb; background: #fff; box-shadow: inset 0 1px 2px #1b1c1a08; }
		.agentic .primary { border-color: #e97822; background: #e97822; box-shadow: 0 3px 7px #e978222b; }
		.agentic .secondary { border-color: #dededb; color: var(--ink); background: #fff; box-shadow: 0 2px 6px #1b1c1a0d; }
		.agentic-hero-grid > div:first-child { padding: 10px 0 4px; }
		.agentic-console { border-color: #e1e1de; border-radius: 13px; background: #fff; box-shadow: 0 10px 24px #1b1c1a12, 0 2px 4px #1b1c1a08; }
		.agentic-console-head { border-color: #e8e8e5; }
		.agentic-console-row { border-color: #eeeeeb; }
		.agentic-console-row span:last-child { color: var(--accent); }
		.agentic-index-list { gap: 10px; padding-top: 12px; }
		.agentic-index-row { padding: 17px 18px; border: 1px solid #e4e4e1; border-radius: 10px; background: #fff; box-shadow: 0 5px 14px #1b1c1a0b, 0 1px 2px #1b1c1a0b; }
		.agentic-index-row small { color: var(--accent); }
		.agentic-doc-head { padding: 32px 34px; border: 1px solid #e4e4e1; border-radius: 13px; background: #fff; box-shadow: 0 8px 20px #1b1c1a0d; }
		.agentic-doc-body { padding-top: 40px; }
		.agentic-doc-nav { padding: 16px 0 0 14px; border-left: 1px solid #e7e7e4; }
		.agentic .callout { border-color: #e4e4e1; border-left-color: var(--accent); border-radius: 10px; background: #fff; box-shadow: 0 5px 14px #1b1c1a0b; }
		.status { position: fixed; left: 20px; bottom: 20px; padding: 9px 12px; border: 1px solid #d5d1c7; border-radius: 6px; color: #77736b; background: #f5f3ef; font-size: 11px; opacity: 0; transform: translateY(6px); transition: .2s ease; pointer-events: none; }
		.status.show { opacity: 1; transform: none; }
		@media (max-width: 900px) {
			.shell { grid-template-columns: 205px minmax(0, 1fr); }
			.stage { padding: 18px; }
			.preview-nav { padding: 16px 20px; }
			.nav-links { display: none; }
			.mandala-orbit { right: 6%; opacity: .3; }
			.document { grid-template-columns: 150px minmax(0, 1fr); gap: 25px; padding: 48px 6%; }
			.document-right { display: none; }
		}
		@media (max-width: 620px) {
			.shell { display: block; }
			.rail { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid #d5d1c7; }
			.rail h1, .rail-rule, .note, .view-list { display: none; }
			.rail .eyebrow { margin: 0 8px 0 0; white-space: nowrap; }
			.site-list { display: flex; gap: 6px; }
			.site-button { width: auto; white-space: nowrap; }
			.stage { padding: 10px; }
			.stage-top { margin-bottom: 10px; }
			.device-controls { display: none; }
			.canvas { min-height: 780px; border-radius: 8px; }
			.home { padding: 55px 24px; }
			.home h2 { font-size: 54px; }
			.mandala-orbit { top: 170px; right: 13px; width: 150px; height: 150px; }
			.mandala-symbol { inset: 57px; font-size: 25px; }
			.mandala-orbit::before { inset: 18px; }
			.mandala-orbit::after { inset: 49px; }
			.section { margin-top: 80px; }
			.card-grid { grid-template-columns: 1fr; }
			.card:nth-child(n) { transform: none; }
			.document { display: block; padding: 42px 24px; }
			.document-aside { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 35px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
			.document-aside strong { display: none; }
			.document-aside button { width: auto; white-space: nowrap; }
		}
	</style>
</head>
<body>
	<div class="shell">
		<aside class="rail">
			<div>
				<p class="eyebrow">Prototype review</p>
				<h1>Documentation<br>templates</h1>
			</div>
			<div class="site-list" aria-label="Choose a site">
				<button class="site-button active" data-site="mandala"><span class="site-dot"></span>fractalmandala</button>
				<button class="site-button" data-site="agentic"><span class="site-dot"></span>fractalagentic</button>
				<button class="site-button" data-site="design"><span class="site-dot"></span>fractaldesign</button>
			</div>
			<div class="rail-rule"></div>
			<div class="view-list" aria-label="Choose a page template">
				<button class="view-button active" data-view="home">01 / Main page</button>
				<button class="view-button" data-view="document">02 / Document page</button>
			</div>
			<p class="note">Review the visual language and page rhythm first. These screens are intentionally content-light and implementation-free.</p>
		</aside>
		<main class="stage">
			<div class="stage-top">
				<div class="stage-title"><strong id="stage-site">fractalmandala</strong> / <span id="stage-view">main page</span></div>
				<div class="device-controls" aria-label="Preview size">
					<button class="device-button active" data-device="desktop">Desktop</button>
					<button class="device-button" data-device="mobile">Mobile</button>
				</div>
			</div>
			<div class="canvas-wrap">
				<section class="canvas preview mandala" id="canvas">
					<nav class="preview-nav">
						<div class="brand" id="brand">fractal mandala</div>
						<div class="nav-links"><button data-action="Navigate to index">Index</button><button data-action="Open writings">Writings</button><button data-action="Open about">About</button></div>
						<div class="nav-utility"><input class="search" id="search" placeholder="Search knowledge" aria-label="Search knowledge"><button data-action="Open menu">•••</button></div>
					</nav>
					<div id="page"></div>
				</section>
			</div>
		</main>
	</div>
	<div class="status" id="status" role="status"></div>
	<script>
		const sites = {
			mandala: {
				brand: 'fractal mandala',
				home: { kicker: 'A living knowledge bank', title: 'Make room for the whole pattern.', lede: 'A quiet, cross-disciplinary library for ideas that become clearer when they are allowed to sit beside one another.', cards: [['01', 'Civilization', 'Patterns of people, power, and place.'], ['02', 'Comparative worlds', 'Many lenses, one widening field.'], ['03', 'Writings', 'Notes from the edge of the map.']] },
				document: { kicker: 'Civilization / Orientation', title: 'The long view', intro: 'A starting point for reading culture as a living pattern rather than a fixed archive.', sections: ['A wider frame', 'The first question', 'Related notes'] }
			},
			agentic: {
				brand: 'fractal_agentic / armory',
				home: { kicker: 'A field guide for agentic systems', title: 'Build the loop. Keep the signal.', lede: 'Practical patterns, bosses, and operating notes for people building software that can reason, act, and recover.', cards: [['01', 'Bosses', 'Named capabilities for hard engineering work.'], ['02', 'Patterns', 'Small protocols with a long half-life.'], ['03', 'Playbooks', 'From first prompt to durable system.'], ['04', 'Continuity', 'Context that survives the next handoff.']] },
				document: { kicker: 'Bosses / Svelte', title: 'Svelte boss', intro: 'A focused operating guide for building SvelteKit interfaces with clarity, speed, and a clean handoff.', sections: ['Mission', 'Operating rules', 'Related skills'] }
			},
			design: {
				brand: 'fractaldesign / notes',
				home: { kicker: 'Interfaces with a point of view', title: 'Design is a way of making room.', lede: 'A working archive of systems, components, and visual experiments for software that feels considered.', cards: [['01', 'Foundations', 'Tokens, rhythm, and the shape of a system.'], ['02', 'Components', 'The practical vocabulary of the interface.'], ['03', 'Playground', 'Experiments worth keeping around.']] },
				document: { kicker: 'Foundations / Typography', title: 'A generous measure', intro: 'The best reading surfaces give language enough room to reveal its structure.', sections: ['The measure', 'Hierarchy', 'More to explore'] }
			}
		};
		let site = 'mandala';
		let view = 'home';
		const canvas = document.getElementById('canvas');
		const page = document.getElementById('page');
		const status = document.getElementById('status');
		const stageSite = document.getElementById('stage-site');
		const stageView = document.getElementById('stage-view');
		const search = document.getElementById('search');
		function render() {
			const data = sites[site];
			canvas.className = `canvas preview ${site}`;
			document.getElementById('brand').textContent = data.brand;
			stageSite.textContent = `fractal${site}`;
			stageView.textContent = view === 'home' ? 'main page' : 'document page';
			search.placeholder = site === 'agentic' ? 'Search armory' : site === 'design' ? 'Search notes' : 'Search knowledge';
			if (site === 'agentic') {
				page.innerHTML = view === 'home' ? `<div class="agentic-home"><section class="agentic-hero"><div class="home-kicker">${data.home.kicker}</div><div class="agentic-hero-grid"><div><h2>${data.home.title}</h2><p class="home-lede">${data.home.lede}</p><div class="home-actions"><button class="primary" data-action="Open the armory">Open the armory</button><button class="secondary" data-action="Read the field guide">Read the field guide</button></div></div><div class="agentic-console"><div class="agentic-console-head"><strong>system / ready</strong><span>v0.7.3</span></div><div class="agentic-console-row"><span>context continuity</span><span>100%</span></div><div class="agentic-console-row"><span>active playbooks</span><span>24</span></div><div class="agentic-console-row"><span>last handoff</span><span>clean</span></div></div></div></section><section class="agentic-index"><div class="agentic-index-top"><h3>Armory index</h3><span>${data.home.cards.length} systems / browse all</span></div><div class="agentic-index-list">${data.home.cards.map(card => `<article class="agentic-index-row"><small>${card[0]}</small><strong>${card[1]}</strong><span>${card[2]}</span><small>open →</small></article>`).join('')}</div></section></div>` : `<div class="agentic-doc"><header class="agentic-doc-head"><div><div class="doc-kicker">${data.document.kicker}</div><h2>${data.document.title}</h2></div><p class="agentic-doc-summary">${data.document.intro}</p></header><div class="agentic-doc-body"><aside class="agentic-doc-nav"><strong>On this page</strong>${data.document.sections.map(section => `<button data-action="Jump to ${section}">${section}</button>`).join('')}</aside><article class="prose"><div class="meta"><span>Updated today</span><span>8 min read</span></div><p>Good documentation keeps the signal visible. Establish the context, make the next action obvious, then leave enough room for the reader to form a useful mental model.</p><div class="callout">A dependable operating rhythm: orient → act → inspect → hand off.</div><h3>${data.document.sections[0]}</h3><p>Start with the premise, name the vocabulary, and make the boundary of the system legible before introducing its deeper mechanics.</p><h3>${data.document.sections[1]}</h3><p>The detail belongs here: examples, commands, and references should feel like a natural deepening of the opening promise.</p></article></div></div>`;
				return;
			}
			if (site === 'design') {
				page.innerHTML = view === 'home' ? `<div class="design-home"><div class="design-home-intro"><div><div class="design-home-meta"><span>Fractal design / 001</span><span>Open archive ↗</span></div><h2>${data.home.title}</h2></div><p class="design-home-lede">${data.home.lede}</p></div><section class="design-board"><article class="design-feature"><div class="board-label">Featured note</div><h3>Make the system feel inevitable.</h3><p>Foundations for interfaces with a point of view.</p></article>${data.home.cards.map(card => `<article><div class="board-label">${card[0]} / collection</div><h4>${card[1]}</h4><p>${card[2]}</p></article>`).join('')}</section></div>` : `<div class="design-doc"><div class="design-doc-number">02</div><article class="design-doc-main"><div class="doc-kicker">${data.document.kicker}</div><h2>${data.document.title}</h2><div class="meta"><span>Updated today</span><span>8 min read</span></div><p class="document-intro">${data.document.intro}</p><div class="prose"><p>Good documentation gives language enough room to reveal its structure. The page should feel composed, but never precious: a clear invitation to look closer.</p><div class="callout">A generous measure is a design decision. It lets the reader keep their place.</div><h3>${data.document.sections[0]}</h3><p>Start with the premise, name the vocabulary, and keep the page calm enough that the reader can build their own map.</p><h3>${data.document.sections[1]}</h3><p>The detail belongs here. Long-form content, examples, and references should feel like a natural deepening of the opening promise.</p></div></article><aside class="design-doc-related"><strong>Continue</strong><a href="#">${data.document.sections[2]}</a><a href="#">Index overview</a><a href="#">Edit this page</a></aside></div>`;
				return;
			}
			if (view === 'home') {
				page.innerHTML = `<div class="home"><div class="home-kicker">${data.home.kicker}</div><h2>${data.home.title}</h2><p class="home-lede">${data.home.lede}</p><div class="home-actions"><button class="primary" data-action="Open the library">Enter the library</button><button class="secondary" data-action="View the map">View the map</button></div>${site === 'mandala' ? '<div class="mandala-orbit"><div class="mandala-symbol">ॐ</div></div>' : ''}<div class="section"><div class="section-head"><h3>${site === 'agentic' ? 'Armory index' : site === 'design' ? 'The working set' : 'Knowledge bank'}</h3><span>${data.home.cards.length} collections</span></div><div class="card-grid">${data.home.cards.map(card => `<article class="card"><div class="card-index">${card[0]}</div><h4>${card[1]}</h4><p>${card[2]}</p></article>`).join('')}</div></div></div>`;
			} else {
				page.innerHTML = `<div class="document"><aside class="document-aside"><strong>On this page</strong>${data.document.sections.map((section, index) => `<button class="${index === 0 ? 'active' : ''}" data-action="Jump to ${section}">${section}</button>`).join('')}</aside><article class="document-main"><div class="doc-kicker">${data.document.kicker}</div><h2>${data.document.title}</h2><div class="meta"><span>Updated today</span><span>8 min read</span></div><p class="document-intro">${data.document.intro}</p><div class="prose"><p>Good documentation does not rush to the answer. It gives the reader a clear edge to stand on, then lets the next idea arrive with enough space around it.</p><div class="callout">A template should establish a dependable rhythm: orientation, substance, and a small invitation to continue.</div><h3>${data.document.sections[0]}</h3><p>Start with the premise, name the vocabulary, and keep the page calm enough that the reader can build their own map.</p><h3>${data.document.sections[1]}</h3><p>The detail belongs here. Long-form content, examples, and references should feel like a natural deepening of the opening promise.</p></div></article><aside class="document-right"><strong>Next</strong><a href="#">${data.document.sections[2]}</a><a href="#">Index overview</a><a href="#">Edit this page</a></aside></div>`;
			}
		}
		function showStatus(message) {
			status.textContent = message;
			status.classList.add('show');
			clearTimeout(showStatus.timer);
			showStatus.timer = setTimeout(() => status.classList.remove('show'), 1800);
		}
		document.querySelectorAll('[data-site]').forEach(button => button.addEventListener('click', () => { site = button.dataset.site; document.querySelectorAll('[data-site]').forEach(item => item.classList.toggle('active', item === button)); render(); }));
		document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { view = button.dataset.view; document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('active', item === button)); render(); }));
		document.querySelectorAll('[data-device]').forEach(button => button.addEventListener('click', () => { canvas.classList.toggle('mobile', button.dataset.device === 'mobile'); document.querySelectorAll('[data-device]').forEach(item => item.classList.toggle('active', item === button)); }));
		document.addEventListener('click', event => { const button = event.target.closest('[data-action]'); if (button) showStatus(button.dataset.action); });
		search.addEventListener('keydown', event => { if (event.key === 'Enter' && search.value.trim()) showStatus(`Searching ${site}: ${search.value.trim()}`); });
		render();
	</script>
</body>
</html>
